# Prometheus configuration for the TPT Pay core (payments API).
# Used by the "monitoring" profile of the root docker-compose.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'tpt-pay-core'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'tpt-pay-core:8080'
        labels:
          service: 'tpt-pay-core'

  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'
