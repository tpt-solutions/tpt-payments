# Grafana dashboard provider configuration.
apiVersion: 1
providers:
  - name: 'TPT Credit Dashboards'
    orgId: 1
    folder: 'TPT Credit'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false