# Prometheus configuration for TPT Credit chain monitoring.
# This config scrapes the chain node's metrics endpoint and provides
# system-level monitoring for the testnet/devnet.
global:
  scrape_interval:     15s
  evaluation_interval: 15s

# Alerting configuration.
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files for alerting conditions.
rule_files:
  # - "alerts.yml"

scrape_configs:
  # Scrape TPT Credit chain node metrics.
  - job_name: 'tpt-credit-chain'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'host.docker.internal:26660'
        labels:
          network: 'tpt-credit-testnet'

  # Scrape node exporter for system metrics (CPU, memory, disk).
  - job_name: 'node-exporter'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'node-exporter:9100'
        labels:
          network: 'tpt-credit-testnet'

  # Self-scrape Prometheus.
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'localhost:9090'