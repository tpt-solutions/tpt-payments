apiVersion: v2
name: tpt-payments
description: TPT Payments - Open Source Stripe Alternative
type: application
version: 0.2.0
appVersion: 0.1.0
home: https://github.com/tpt-solutions/tpt-payments
sources:
  - https://github.com/tpt-solutions/tpt-payments
maintainers:
  - name: TPT Payments Team
keywords:
  - payments
  - stripe
  - payment-gateway
  - fintech
  - billing
  - subscriptions
dependencies:
  - name: postgresql
    version: 18.12.25
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 28.3.15
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: nats
    version: 2.15.3
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
