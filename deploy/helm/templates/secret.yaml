{{- if not .Values.database.existingSecret }}
{{- /*
The database password comes from values only when no existingSecret is set. Refuse to
render with an empty password, so a release never ships with a guessable default.
*/ -}}
{{- if not .Values.database.password }}
{{- fail "database.password must be set, or database.existingSecret must name a Secret with key DATABASE_URL" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tpt-payments.fullname" . }}
  labels:
    {{- include "tpt-payments.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=%s" .Values.postgresql.auth.username .Values.database.password (include "tpt-payments.postgresql.fullname" .) .Values.postgresql.auth.database .Values.database.sslmode | quote }}
{{- end }}
