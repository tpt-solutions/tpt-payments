# Default values for tpt-payments.

replicaCount: 2

image:
  repository: ghcr.io/tpt-solutions/tpt-payments
  pullPolicy: IfNotPresent
  # Empty means the chart appVersion. Set an explicit tag for production deploys.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Pod hardening. The image is distroless and runs as the nonroot user (65532).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.tpt-payments.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Database connection. Exactly one of these must be set:
#   password:        the chart creates a Secret with DATABASE_URL built from it
#   existingSecret:  name of a Secret you manage, with a DATABASE_URL key (recommended)
database:
  password: ""
  existingSecret: ""
  # require is the default. Use verify-full with a CA bundle for production.
  sslmode: require

# Bundled PostgreSQL (dev and evaluation only). Set auth.password here, to the same value as
# database.password, and set auth.existingSecret to avoid storing it in values.
postgresql:
  enabled: false
  auth:
    username: tpt_payments
    database: tpt_payments
    password: ""
    existingSecret: ""

# Bundled Redis (dev and evaluation only).
redis:
  enabled: false
  architecture: standalone
  auth:
    enabled: false

# Bundled NATS with JetStream (dev and evaluation only). The webhook transport that uses it is
# not built yet, so this can stay disabled.
nats:
  enabled: false
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 10Gi

# Environment configuration (non-secret). Keys here are passed to the container as-is.
env:
  LOG_LEVEL: info
  API_RATE_LIMIT: "100"
