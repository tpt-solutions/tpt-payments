# Default values for tpt-payments.

replicaCount: 2

image:
  repository: ghcr.io/tpt-payments/tpt-payments
  pullPolicy: IfNotPresent
  # Empty means the chart appVersion. Set an explicit tag for production deploys.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.tpt-payments.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Database configuration
postgresql:
  enabled: true
  auth:
    username: tpt_payments
    password: tpt_payments
    database: tpt_payments

# Redis configuration
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false

# NATS configuration
nats:
  enabled: true
  nats:
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        size: 10Gi

# Environment configuration
env:
  LOG_LEVEL: info
  API_RATE_LIMIT: 100