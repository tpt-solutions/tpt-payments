name: Security scanning

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly scan every Monday at 08:00 UTC
    - cron: "0 8 * * 1"

jobs:
  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      # govulncheck must run inside each Go module: the repo root has no go.mod,
      # so `govulncheck ./packages/<mod>/...` fails with "no go.mod file".
      - name: Run govulncheck (tpt-pay-core)
        working-directory: packages/tpt-pay-core
        run: govulncheck ./...
      - name: Run govulncheck (tpt-credit-chain)
        working-directory: packages/tpt-credit-chain
        run: govulncheck ./...

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.39.4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4.39.4
        with:
          category: "/language:${{ matrix.language }}"

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Audit JS packages
        run: |
          for dir in frontend packages/tpt-pay deploy/testnet/faucet examples/node-express-checkout examples/nextjs-checkout examples/subscription-billing; do
            echo "Auditing $dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=high)
          done

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      # Full history: a secret committed and later removed is still a leak.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      # The CLI, not gitleaks-action: the action needs a paid licence for organisation accounts.
      - name: Install gitleaks (pinned)
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan history (known historical findings are listed in .gitleaksignore)
        run: |
          "$(go env GOPATH)/bin/gitleaks" git . --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact

  dependabot:
    name: Dependabot config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Dependabot config exists
        run: |
          if [ ! -f ".github/dependabot.yml" ]; then
            echo "::error::Dependabot config is missing — add .github/dependabot.yml"
            exit 1
          fi
