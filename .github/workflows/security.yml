name: Security scanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly scan every Monday at 08:00 UTC
    - cron: "0 8 * * 1"

jobs:
  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck (tpt-pay-core)
        run: govulncheck ./packages/tpt-pay-core/...
      - name: Run govulncheck (tpt-credit-chain)
        run: govulncheck ./packages/tpt-credit-chain/...
        continue-on-error: true  # chain deps may have advisories outside our control

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit JS packages (when they exist)
        run: |
          for dir in packages/tpt-pay-dashboard packages/tpt-pay-sdk-js; do
            if [ -f "$dir/package.json" ]; then
              echo "Auditing $dir"
              cd "$dir" && npm audit --audit-level=high && cd -
            fi
          done

  dependabot:
    name: Dependabot config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify Dependabot config exists
        run: |
          if [ ! -f ".github/dependabot.yml" ]; then
            echo "::warning::Dependabot config is missing — add .github/dependabot.yml"
          fi
