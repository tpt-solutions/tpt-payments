name: Security scanning

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly scan every Monday at 08:00 UTC
    - cron: "0 8 * * 1"

jobs:
  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run govulncheck (tpt-pay-core)
        run: govulncheck ./packages/tpt-pay-core/...
      - name: Run govulncheck (tpt-credit-chain)
        run: govulncheck ./packages/tpt-credit-chain/...

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Audit JS packages
        run: |
          for dir in frontend packages/tpt-pay; do
            echo "Auditing $dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=high)
          done

  dependabot:
    name: Dependabot config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Dependabot config exists
        run: |
          if [ ! -f ".github/dependabot.yml" ]; then
            echo "::error::Dependabot config is missing — add .github/dependabot.yml"
            exit 1
          fi
