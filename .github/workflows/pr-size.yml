name: PR size

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs with write access, so this job never checks out or runs code
      # from the pull request. It only reads the changed-file list through the API and sets one
      # size label.
      - uses: actions/github-script@v7
        with:
          script: |
            // Lockfiles and generated files are excluded: a dependency bump or a regenerated
            // client should not make a small change look large.
            const ignored = [
              /(^|\/)package-lock\.json$/,
              /(^|\/)go\.sum$/,
              /(^|\/)go\.work\.sum$/,
              /(^|\/)atlas\.sum$/,
              /(^|\/)generated\//,
              /(^|\/)openapi\.json$/,
            ];
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            let changed = 0;
            for (const f of files) {
              if (ignored.some((re) => re.test(f.filename))) continue;
              changed += f.additions + f.deletions;
            }

            // Thresholds are changed lines (added + removed): XS < 10, S < 100, M < 500, L < 1000,
            // XL otherwise.
            const bands = [
              [10, 'size/XS'],
              [100, 'size/S'],
              [500, 'size/M'],
              [1000, 'size/L'],
            ];
            const label = (bands.find(([max]) => changed < max) || [null, 'size/XL'])[1];
            const sizeLabels = ['size/XS', 'size/S', 'size/M', 'size/L', 'size/XL'];

            const issue_number = context.payload.pull_request.number;
            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            for (const l of current) {
              if (sizeLabels.includes(l.name) && l.name !== label) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  name: l.name,
                });
              }
            }
            if (!current.some((l) => l.name === label)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                labels: [label],
              });
            }
            core.info(`${changed} changed lines (ignoring lockfiles and generated files): ${label}`);
