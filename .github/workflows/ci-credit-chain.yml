name: CI — tpt-credit-chain

on:
  push:
    branches: [master]
    paths:
      - "packages/tpt-credit-chain/**"
      - ".github/workflows/ci-credit-chain.yml"
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: packages/tpt-credit-chain

  test:
    name: Unit + simulation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Run unit tests with coverage
        working-directory: packages/tpt-credit-chain
        run: go test -count=1 -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        working-directory: packages/tpt-credit-chain
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: credit-chain-coverage
          path: packages/tpt-credit-chain/coverage.out
      - name: Check invariants
        working-directory: packages/tpt-credit-chain
        run: |
          # The pattern must match real tests. An empty match runs nothing and passes, so fail if
          # no TestInvariant test reports PASS.
          go test -count=1 -v -run '^TestInvariant' ./x/... | tee invariants.log
          grep -q -- '--- PASS: TestInvariant' invariants.log

  build:
    name: Build chain binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Build tptcreditd
        working-directory: packages/tpt-credit-chain
        run: go build -o /dev/null ./cmd/tptcreditd

  # Always-run gate. Branch protection should require this one check: it reports even when a
  # path filter skipped the other jobs, and it fails if any job did not succeed.
  required:
    name: Required checks
    if: always()
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        run: |
          [ "${{ needs.lint.result }}" = "success" ] || { echo "lint did not succeed"; exit 1; }
          [ "${{ needs.test.result }}" = "success" ] || { echo "test did not succeed"; exit 1; }
          [ "${{ needs.build.result }}" = "success" ] || { echo "build did not succeed"; exit 1; }
          echo "all required checks passed"
