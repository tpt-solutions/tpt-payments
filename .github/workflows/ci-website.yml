name: CI website

on:
  push:
    branches: [main, master]
    paths: ["website/**", "docs/**", "packages/tpt-pay-core/api/openapi.json", ".github/workflows/ci-website.yml"]
  pull_request:
    paths: ["website/**", "docs/**", "packages/tpt-pay-core/api/openapi.json", ".github/workflows/ci-website.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      # The build fails on broken internal links and anchors (see docusaurus.config.js), so this
      # step is the documentation link check.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
      # The site serves a copy of the spec that the API serves. They must match.
      - name: Check the published OpenAPI copy is current
        run: cmp static/openapi.json ../packages/tpt-pay-core/api/openapi.json
      - name: Build (includes the link check)
        run: npm run build
