name: Stripe compatibility report

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  compatibility:
    runs-on: ubuntu-latest
    name: Measured route coverage
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Generate report from the real router
        run: go run ./packages/tpt-pay-core/cmd/compatreport --output compatibility-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-report
          path: compatibility-report.md

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          filePath: compatibility-report.md
          comment_tag: compatibility-report
