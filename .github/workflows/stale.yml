name: Stale issues and pull requests

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has had no activity for 60 days, so it is marked stale. It will be closed in
            14 days unless there is new activity.
          stale-pr-message: >
            This pull request has had no activity for 30 days, so it is marked stale. It will be
            closed in 14 days unless there is new activity.
          exempt-issue-labels: "security,pinned,roadmap"
          exempt-pr-labels: "security,pinned"
          operations-per-run: 200
