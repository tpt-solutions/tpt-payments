name: CI — tpt-pay-core

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "packages/tpt-pay-core/**"
      - "go.work"
      - ".github/workflows/ci-pay-core.yml"
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: packages/tpt-pay-core

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Run unit tests with race detector and coverage
        run: go test -count=1 -race -short -coverprofile=coverage.out -covermode=atomic ./packages/tpt-pay-core/...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      # A ratchet, not a target: the floor is set just under the measured unit-test coverage
      # (42.0% on the short suite) so a drop fails the build. Raise it when coverage rises.
      - name: Coverage floor
        run: |
          floor=40
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $NF); print $NF}')
          echo "unit-test coverage ${total}% (floor ${floor}%)"
          awk -v t="$total" -v f="$floor" 'BEGIN { exit !(t + 0 >= f + 0) }' \
            || { echo "::error::coverage ${total}% is below the ${floor}% floor"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: pay-core-coverage
          path: coverage.out

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tptpay
          POSTGRES_PASSWORD: tptpay
          POSTGRES_DB: tptpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # NATS is provisioned for the upcoming webhook delivery engine; no test uses it yet.
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
        options: >-
          --health-cmd "nats-server --help"
          --health-interval 10s
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Apply migrations to a fresh database (checks order and syntax)
        env:
          PGPASSWORD: tptpay
        run: |
          for f in packages/tpt-pay-core/migrations/*.sql; do
            echo "applying $(basename "$f")"
            psql -h localhost -U tptpay -d tptpay_test -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Run integration tests
        env:
          TEST_DATABASE_URL: "postgres://tptpay:tptpay@localhost:5432/tptpay_test?sslmode=disable"
        run: go test -count=1 -race ./packages/tpt-pay-core/...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Build server binary
        run: go build -o /dev/null ./packages/tpt-pay-core/cmd/server

  # Always-run gate. Branch protection should require this one check: it reports even when a
  # path filter skipped the other jobs, and it fails if any job did not succeed.
  required:
    name: Required checks
    if: always()
    needs: [lint, unit-test, integration-test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        run: |
          [ "${{ needs.lint.result }}" = "success" ] || { echo "lint did not succeed"; exit 1; }
          [ "${{ needs.unit-test.result }}" = "success" ] || { echo "unit-test did not succeed"; exit 1; }
          [ "${{ needs.integration-test.result }}" = "success" ] || { echo "integration-test did not succeed"; exit 1; }
          [ "${{ needs.build.result }}" = "success" ] || { echo "build did not succeed"; exit 1; }
          echo "all required checks passed"
