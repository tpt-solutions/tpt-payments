name: CI — tpt-pay-core

on:
  push:
    branches: [master]
    paths:
      - "packages/tpt-pay-core/**"
      - "go.work"
      - ".github/workflows/ci-pay-core.yml"
  pull_request:
    paths:
      - "packages/tpt-pay-core/**"
      - "go.work"
      - ".github/workflows/ci-pay-core.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: packages/tpt-pay-core

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - name: Run unit tests with race detector
        run: go test -count=1 -race -short ./packages/tpt-pay-core/...

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tptpay
          POSTGRES_PASSWORD: tptpay
          POSTGRES_DB: tptpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # NATS is provisioned for the upcoming webhook delivery engine; no test uses it yet.
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
        options: >-
          --health-cmd "nats-server --help"
          --health-interval 10s
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - name: Apply migrations to a fresh database (checks order and syntax)
        env:
          PGPASSWORD: tptpay
        run: |
          for f in packages/tpt-pay-core/migrations/*.sql; do
            echo "applying $(basename "$f")"
            psql -h localhost -U tptpay -d tptpay_test -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Run integration tests
        env:
          TEST_DATABASE_URL: "postgres://tptpay:tptpay@localhost:5432/tptpay_test?sslmode=disable"
        run: go test -count=1 -race ./packages/tpt-pay-core/...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - name: Build server binary
        run: go build -o /dev/null ./packages/tpt-pay-core/cmd/server
