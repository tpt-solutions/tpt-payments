name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, test and publish
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tptpay
          POSTGRES_PASSWORD: tptpay
          POSTGRES_DB: tptpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Test (race detector, integration)
        env:
          TEST_DATABASE_URL: "postgres://tptpay:tptpay@localhost:5432/tptpay_test?sslmode=disable"
        run: go test -count=1 -race ./packages/tpt-pay-core/...

      - name: Build release binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA}" \
              -o dist/tpt-pay-server-linux-$arch ./packages/tpt-pay-core/cmd/server
          done
          (cd dist && sha256sum tpt-pay-server-linux-* > checksums.txt)

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: packages/tpt-pay-core
          file: packages/tpt-pay-core/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/tpt-pay-core:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/tpt-pay-core:latest

      - name: Generate changelog
        run: |
          # On the first tag there is no previous tag; the changelog then covers all history.
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE="${PREV:+$PREV..}${GITHUB_REF_NAME}"
          {
            echo "## Changes"
            echo
            git log "$RANGE" --pretty=format:"- %s (%h)"
            echo
          } > "$RUNNER_TEMP/changelog.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/changelog.md
          files: dist/*
          generate_release_notes: false
