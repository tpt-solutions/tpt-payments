name: tpt-platform-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tptpay
      POSTGRES_PASSWORD: tptpay
      POSTGRES_DB: tptpay_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tptpay"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats-test:
    image: nats:2.10-alpine
    command: ["-js"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-runner:
    build:
      context: packages/tpt-pay-core
      dockerfile: Dockerfile.test
    depends_on:
      postgres-test:
        condition: service_healthy
      nats-test:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: "postgres://tptpay:tptpay@postgres-test:5432/tptpay_test?sslmode=disable"
    command: ["go", "test", "-count=1", "-v", "./..."]
