# golangci-lint configuration for tpt-pay-core. CI runs it from this directory.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - errorlint      # errors.Is / errors.As instead of type assertions and ==
    - bodyclose      # HTTP response bodies must be closed
    - gocritic
    - misspell
    - unconvert
    - errname
  settings:
    errcheck:
      check-type-assertions: true

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
