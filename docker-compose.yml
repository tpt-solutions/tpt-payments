# DEVELOPMENT ONLY. The defaults below are for a local laptop. Override them with variables in a
# .env file next to this file. Never run this file against real data or on a shared host.
name: tpt-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tptpay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tptpay}
      POSTGRES_DB: tptpay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tptpay"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  vault:
    image: hashicorp/vault:1.17
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://localhost:8200"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: arigaio/atlas:1.4.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/tpt-pay-core/migrations:/migrations
    command: >
      migrate apply
        --dir "file:///migrations"
        --url "postgres://tptpay:${POSTGRES_PASSWORD:-tptpay}@postgres:5432/tptpay?sslmode=disable"
    restart: "no"

  tpt-pay-core:
    build:
      context: packages/tpt-pay-core
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      vault:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      # Optional: the .env file is gitignored, so CI and fresh clones do not have it.
      - path: packages/tpt-pay-core/.env
        required: false
    environment:
      DATABASE_URL: "postgres://tptpay:${POSTGRES_PASSWORD:-tptpay}@postgres:5432/tptpay?sslmode=disable"
      NATS_URL: "nats://nats:4222"
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "${VAULT_DEV_TOKEN:-dev-root-token}"
    ports:
      - "8080:8080"
    volumes:
      - ./packages/tpt-pay-core:/app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Monitoring is opt-in: docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/prometheus-pay.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      tpt-pay-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # DEVELOPMENT ONLY: required, there is no default password.
      # Compose interpolates this file even when the profile is off, so a missing value is caught
      # by the entrypoint below (only when Grafana actually starts), not by compose itself.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-__unset__}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ "$$GF_SECURITY_ADMIN_PASSWORD" = "__unset__" ] || [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then
          echo "set GRAFANA_ADMIN_PASSWORD in the environment before starting the monitoring profile" >&2
          exit 1
        fi
        exec /run.sh
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/pay/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  nats_data:
  prometheus_data:
  grafana_data:
